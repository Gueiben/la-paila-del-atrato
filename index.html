function vSub(a, b) {
  return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
}
function vCross(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ];
}
function vNorm(a) {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}

function makeTriUV(v0, v1, v2, rgb, emit, tex, uv0, uv1, uv2) {
  const e1 = vSub(v1, v0);
  const e2 = vSub(v2, v0);
  const n = vNorm(vCross(e1, e2));
  return {
    v0: v0,
    v1: v1,
    v2: v2,
    n: n,
    rgb: rgb,
    emit: emit || 0,
    tex: tex || "adoquin",
    uv0: uv0 || [0, 0],
    uv1: uv1 || [0, 1],
    uv2: uv2 || [1, 1]
  };
}

function makeTri(v0, v1, v2, rgb, emit, tex) {
  return makeTriUV(v0, v1, v2, rgb, emit, tex || "adoquin", [0, 0], [0, 1], [1, 1]);
}

function addQuadUV(tris, a, b, c, d, rgb, emit, tex, u0, v0, u1, v1) {
  const uu0 = u0 !== undefined ? u0 : 0.0;
  const vv0 = v0 !== undefined ? v0 : 0.0;
  const uu1 = u1 !== undefined ? u1 : 1.0;
  const vv1 = v1 !== undefined ? v1 : 1.0;
  const tx = tex || "adoquin";
  tris.push(makeTriUV(a, b, c, rgb, emit, tx, [uu0, vv1], [uu0, vv0], [uu1, vv0]));
  tris.push(makeTriUV(a, c, d, rgb, emit, tx, [uu0, vv1], [uu1, vv0], [uu1, vv1]));
}

function addQuad(tris, a, b, c, d, rgb, emit, tex) {
  addQuadUV(tris, a, b, c, d, rgb, emit, tex || "adoquin", 0, 0, 1, 1);
}

function addSubdividedQuadUV(tris, a, b, c, d, segsU, segsV, colA, colB, emit, tex) {
  for (let u = 0; u < segsU; u++) {
    const u0 = u / segsU;
    const u1 = (u + 1) / segsU;
    for (let v = 0; v < segsV; v++) {
      const v0 = v / segsV;
      const v1 = (v + 1) / segsV;
      const bilerp = (uu, vv) => [
        (1 - uu) * (1 - vv) * a[0] + uu * (1 - vv) * d[0] + uu * vv * c[0] + (1 - uu) * vv * b[0],
        (1 - uu) * (1 - vv) * a[1] + uu * (1 - vv) * d[1] + uu * vv * c[1] + (1 - uu) * vv * b[1],
        (1 - uu) * (1 - vv) * a[2] + uu * (1 - vv) * d[2] + uu * vv * c[2] + (1 - uu) * vv * b[2]
      ];
      const p00 = bilerp(u0, v0);
      const p01 = bilerp(u0, v1);
      const p11 = bilerp(u1, v1);
      const p10 = bilerp(u1, v0);
      const col = ((u + v) & 1) === 0 ? colA : colB;
      addQuadUV(tris, p00, p01, p11, p10, col, emit, tex || "catedral", u0, 1 - v1, u1, 1 - v0);
    }
  }
}

function addBox(tris, cx, cy, cz, sx, sy, sz, rgb, emit, tex) {
  const tx = tex || "madera";
  const x0 = cx - sx * 0.5, x1 = cx + sx * 0.5;
  const y0 = cy - sy * 0.5, y1 = cy + sy * 0.5;
  const z0 = cz - sz * 0.5, z1 = cz + sz * 0.5;
  const p000 = [x0, y0, z0], p100 = [x1, y0, z0], p110 = [x1, y1, z0], p010 = [x0, y1, z0];
  const p001 = [x0, y0, z1], p101 = [x1, y0, z1], p111 = [x1, y1, z1], p011 = [x0, y1, z1];
  const dark = [Math.max(0, rgb[0] - 14), Math.max(0, rgb[1] - 14), Math.max(0, rgb[2] - 14)];
  const topCol = [Math.min(255, rgb[0] + 14), Math.min(255, rgb[1] + 14), Math.min(255, rgb[2] + 14)];
  addQuadUV(tris, p000, p010, p110, p100, rgb, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p101, p111, p011, p001, rgb, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p001, p011, p010, p000, dark, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p100, p110, p111, p101, dark, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p010, p011, p111, p110, topCol, emit, tx, 0, 0, 1, 1);
}

function addRotBox(tris, cx, cy, cz, sx, sy, sz, yaw, rgb, emit, tex) {
  const tx = tex || "madera";
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const rot = (lx, ly, lz) => [cx + lx * c + lz * s, cy + ly, cz - lx * s + lz * c];
  const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
  const p000 = rot(-hx, -hy, -hz), p100 = rot(hx, -hy, -hz), p110 = rot(hx, hy, -hz), p010 = rot(-hx, hy, -hz);
  const p001 = rot(-hx, -hy, hz), p101 = rot(hx, -hy, hz), p111 = rot(hx, hy, hz), p011 = rot(-hx, hy, hz);
  const dark = [Math.max(0, rgb[0] - 14), Math.max(0, rgb[1] - 14), Math.max(0, rgb[2] - 14)];
  const topCol = [Math.min(255, rgb[0] + 14), Math.min(255, rgb[1] + 14), Math.min(255, rgb[2] + 14)];
  addQuadUV(tris, p000, p010, p110, p100, rgb, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p101, p111, p011, p001, rgb, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p001, p011, p010, p000, dark, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p100, p110, p111, p101, dark, emit, tx, 0, 0, 1, 1);
  addQuadUV(tris, p010, p011, p111, p110, topCol, emit, tx, 0, 0, 1, 1);
}

function addPyramid(tris, cx, yBase, cz, sx, sy, sz, rgb, emit, tex) {
  const tx = tex || "adoquin";
  const x0 = cx - sx * 0.5, x1 = cx + sx * 0.5;
  const z0 = cz - sz * 0.5, z1 = cz + sz * 0.5;
  const top = [cx, yBase + sy, cz];
  const p00 = [x0, yBase, z0], p10 = [x1, yBase, z0], p11 = [x1, yBase, z1], p01 = [x0, yBase, z1];
  tris.push(makeTriUV(p00, top, p10, rgb, emit, tx, [0, 1], [0.5, 0], [1, 1]));
  tris.push(makeTriUV(p10, top, p11, rgb, emit, tx, [0, 1], [0.5, 0], [1, 1]));
  tris.push(makeTriUV(p11, top, p01, rgb, emit, tx, [0, 1], [0.5, 0], [1, 1]));
  tris.push(makeTriUV(p01, top, p00, rgb, emit, tx, [0, 1], [0.5, 0], [1, 1]));
}

function addCylinder(tris, cx, y0, cz, rBot, rTop, h, segs, rgb, emit, tex) {
  const tx = tex || "madera";
  const y1 = y0 + h;
  const sCount = Math.max(10, segs);
  const dark = [Math.max(0, rgb[0] - 12), Math.max(0, rgb[1] - 12), Math.max(0, rgb[2] - 12)];
  for (let i = 0; i < sCount; i++) {
    const u0 = i / sCount;
    const u1 = (i + 1) / sCount;
    const a0 = u0 * Math.PI * 2;
    const a1 = u1 * Math.PI * 2;
    const b0 = [cx + Math.cos(a0) * rBot, y0, cz + Math.sin(a0) * rBot];
    const b1 = [cx + Math.cos(a1) * rBot, y0, cz + Math.sin(a1) * rBot];
    const t0 = [cx + Math.cos(a0) * rTop, y1, cz + Math.sin(a0) * rTop];
    const t1 = [cx + Math.cos(a1) * rTop, y1, cz + Math.sin(a1) * rTop];
    const c = (i & 1) === 0 ? rgb : dark;
    addQuadUV(tris, b0, t0, t1, b1, c, emit, tx, u0, 0, u1, 1);
    tris.push(makeTriUV([cx, y1, cz], t1, t0, rgb, emit, tx, [0.5, 0.5], [u1, 0], [u0, 0]));
  }
}

// Superficie de revolucion (lathe) organica de alta definicion con coordenadas UV completas
function addLatheSculpted(tris, cx, cy, cz, profileYR, segs, scaleX, scaleY, scaleZ, yaw, rgb, emit, tex, vMin, vMax) {
  const tx = tex || "chontaduro";
  const vvMin = vMin !== undefined ? vMin : 0.0;
  const vvMax = vMax !== undefined ? vMax : 1.0;
  const altCol = [Math.max(0, rgb[0] - 10), Math.max(0, rgb[1] - 10), Math.max(0, rgb[2] - 10)];
  const numR = profileYR.length;
  for (let r = 0; r < numR - 1; r++) {
    const p0 = profileYR[r];
    const p1 = profileYR[r + 1];
    const v0 = vvMin + (1.0 - r / Math.max(1, numR - 1)) * (vvMax - vvMin);
    const v1 = vvMin + (1.0 - (r + 1) / Math.max(1, numR - 1)) * (vvMax - vvMin);
    for (let s = 0; s < segs; s++) {
      const u0 = s / segs;
      const u1 = (s + 1) / segs;
      const a0 = yaw + u0 * Math.PI * 2;
      const a1 = yaw + u1 * Math.PI * 2;
      const q00 = [cx + Math.cos(a0) * p0[1] * scaleX, cy + p0[0] * scaleY, cz + Math.sin(a0) * p0[1] * scaleZ];
      const q10 = [cx + Math.cos(a1) * p0[1] * scaleX, cy + p0[0] * scaleY, cz + Math.sin(a1) * p0[1] * scaleZ];
      const q11 = [cx + Math.cos(a1) * p1[1] * scaleX, cy + p1[0] * scaleY, cz + Math.sin(a1) * p1[1] * scaleZ];
      const q01 = [cx + Math.cos(a0) * p1[1] * scaleX, cy + p1[0] * scaleY, cz + Math.sin(a0) * p1[1] * scaleZ];
      const col = ((r + s) & 1) === 0 ? rgb : altCol;
      addQuadUV(tris, q00, q01, q11, q10, col, emit, tx, u0, v1, u1, v0);
    }
  }
}

function addSphereLowPoly(tris, cx, cy, cz, rx, ry, rz, yaw, rgb, emit, tex, vMin, vMax) {
  const profile = [
    [-1.00, 0.04],
    [-0.82, 0.48],
    [-0.48, 0.84],
    [-0.12, 0.98],
    [0.20, 0.96],
    [0.54, 0.80],
    [0.84, 0.46],
    [1.00, 0.04]
  ];
  addLatheSculpted(tris, cx, cy, cz, profile, 12, rx, ry, rz, yaw, rgb, emit, tex || "borojo", vMin, vMax);

// Palmera de Chontaduro Curva con Hojas Doradas/Bronce del Atardecer (CERO verde chillon)
function addCrashPalmTree(tris, px, py, pz, scale, leanX, leanZ) {
  const segs = 7;
  let curX = px, curY = py, curZ = pz;
  for (let s = 0; s < segs; s++) {
    const t = s / segs;
    const h = 1.05 * scale;
    const nx = curX + leanX * (t + 0.15) * 0.32;
    const nz = curZ + leanZ * (t + 0.15) * 0.32;
    const r0 = (0.44 - t * 0.22) * scale;
    const r1 = (0.40 - (t + 1 / segs) * 0.22) * scale;
    const barkCol = (s & 1) === 0 ? [154, 96, 52] : [128, 78, 42];
    addCylinder(tris, (curX + nx) * 0.5, curY, (curZ + nz) * 0.5, r0, r1, h, 10, barkCol, 0.05, "palma_tronco");
    curX = nx;
    curY += h;
    curZ = nz;
  }
  // Racimos de Chontaduro Esculpidos bajo la copa
  addSculptedChontaduro3D(tris, curX + 0.38 * scale, curY - 0.25 * scale, curZ, 0.72 * scale, 0, false);
  addSculptedChontaduro3D(tris, curX - 0.35 * scale, curY - 0.25 * scale, curZ + 0.28 * scale, 0.72 * scale, 1.2, true);

  // 8 Pencas Curvas con paleta Calida Dorada/Ocre/Bronce de Atardecer (CERO verde dominante!)
  const numFronds = 8;
  for (let f = 0; f < numFronds; f++) {
    const ang = (f / numFronds) * Math.PI * 2;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const pxn = -sa * 0.52 * scale, pzn = ca * 0.52 * scale;
    const p0 = [curX, curY + 0.2 * scale, curZ];
    const p1 = [curX + ca * 1.5 * scale, curY + 0.62 * scale, curZ + sa * 1.5 * scale];
    const p2 = [curX + ca * 2.9 * scale, curY + 0.12 * scale, curZ + sa * 2.9 * scale];
    const p3 = [curX + ca * 4.0 * scale, curY - 0.75 * scale, curZ + sa * 4.0 * scale];
    const leafWarm = (f & 1) === 0 ? [184, 146, 56] : [162, 124, 48];
    const leafShade = [138, 102, 42];
    tris.push(makeTriUV(p0, [p1[0] + pxn, p1[1], p1[2] + pzn], p2, leafWarm, 0.08, "popocho", [0.5, 0], [0, 0.5], [0.5, 0.8]));
    tris.push(makeTriUV(p0, p2, [p1[0] - pxn, p1[1], p1[2] - pzn], leafShade, 0.05, "popocho", [0.5, 0], [0.5, 0.8], [1, 0.5]));
    tris.push(makeTriUV([p1[0] + pxn, p1[1], p1[2] + pzn], [p2[0] + pxn * 0.7, p2[1], p2[2] + pzn * 0.7], p3, leafWarm, 0.08, "popocho", [0, 0.5], [0, 0.85], [0.5, 1]));
    tris.push(makeTriUV([p1[0] - pxn, p1[1], p1[2] - pzn], p3, [p2[0] - pxn * 0.7, p2[1], p2[2] - pzn * 0.7], leafShade, 0.05, "popocho", [1, 0.5], [0.5, 1], [1, 0.85]));
  }
}

  // Tenis esculpidos
  const lShoe = toWorld(-0.22, 0.14 + Math.max(0, legSw * 0.25), legSw * 0.85);
  const rShoe = toWorld(0.22, 0.14 + Math.max(0, -legSw * 0.25), -legSw * 0.85);

  addLatheSculpted(tris, lLeg[0], lLeg[1], lLeg[2], legProfile, 10, scale, scale, scale, yaw, pantsRgb, 0.05, "personaje", 0.72, 0.90);
  addLatheSculpted(tris, rLeg[0], rLeg[1], rLeg[2], legProfile, 10, scale, scale, scale, yaw, pantsRgb, 0.05, "personaje", 0.72, 0.90);

  // Torso anatomico esculpido (cintura, pecho, hombros redondeados)

  addLatheSculpted(tris, hip[0], hip[1], hip[2], torsoProfile, 12, scale, scale, scale, yaw, shirtRgb, 0.14, "personaje", 0.38, 0.72);

  // Brazos torneados con hombros y manos esfericas
  const armProfile = [
    [-0.42, 0.09],
    [-0.22, 0.10],
    [0.00, 0.12],
    [0.16, 0.14]

  const lArm = toWorld(-0.52, 1.42, -armSw * 0.45);

  addLatheSculpted(tris, lArm[0], lArm[1], lArm[2], armProfile, 10, scale, scale, scale, yaw, skinRgb, 0.08, "personaje", 0.05, 0.35);

  if (weaponSwing >= 0) {

  // Cabeza esculpida con rostro mapeado en la parte superior del atlas + sombrero chocoano torneado

function drawTexturedTriangleAffine(ctx, img, x0, y0, x1, y1, x2, y2, u0, v0, u1, v1, u2, v2, shadeRgba) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.closePath();
  ctx.clip();

  const tw = img.naturalWidth || 64;
  const th = img.naturalHeight || 64;
  const su0 = u0 * tw, sv0 = v0 * th;
  const su1 = u1 * tw, sv1 = v1 * th;
  const su2 = u2 * tw, sv2 = v2 * th;

  const det = (su1 - su0) * (sv2 - sv0) - (su2 - su0) * (sv1 - sv0);
  if (Math.abs(det) > 1e-4) {
    const idet = 1.0 / det;
    const a = ((x1 - x0) * (sv2 - sv0) - (x2 - x0) * (sv1 - sv0)) * idet;
    const b = ((y1 - y0) * (sv2 - sv0) - (y2 - y0) * (sv1 - sv0)) * idet;
    const c = ((su1 - su0) * (x2 - x0) - (su2 - su0) * (x1 - x0)) * idet;
    const d = ((su1 - su0) * (y2 - y0) - (su2 - su0) * (y1 - y0)) * idet;
    const e = x0 - a * su0 - c * sv0;
    const f = y0 - b * su0 - d * sv0;
    ctx.transform(a, b, c, d, e, f);
    ctx.drawImage(img, 0, 0);
  }
  ctx.restore();

  if (shadeRgba) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.fillStyle = shadeRgba;
    ctx.fill();
  }
}


function terrainHeight(x, z) {
  if (x < -28) return -1.3; // Rio Atrato
  if (z > 28) return Math.min(3.4, (z - 28) * 0.14); // Escalinata Plaza Catedral
  if (x > 26) return Math.sin(x * 0.14) * Math.cos(z * 0.14) * 0.95 + 0.55; // Sendero de Tierra Rojiza del Tutunendo
  if (z < -26) return -0.45 + Math.sin(x * 0.2) * 0.25; // Esteros y Muelle Sur
  return Math.sin(x * 0.12) * Math.cos(z * 0.12) * 0.25;
}

function getZoneInfo(x, z) {
  if (z > 22) return { name: "PLAZA CATEDRAL SAN FRANCISCO DE ASIS", sub: "Centro Historico de Quibdo", col: "#FFD166" };
  if (x < -14) return { name: "EL MALECON DEL RIO ATRATO", sub: "Muelle Turistico y Champas", col: "#38BDF8" };

}

function buildQuibdoOpenWorld() {
  const staticTris = [];
  const billboards = []; // CERO fotos reales pegadas!

  // 1. Terreno de Quibdo con Texturas UV Pintadas (Adoquin Terracota, Piedra Ocre y Madera de Muelle, CERO VERDE!)
  const step = 4.0;
  for (let gx = -56; gx < 56; gx += step) {
    for (let gz = -56; gz < 56; gz += step) {
      if (gx < -28) continue;
      const x0 = gx, x1 = gx + step;
      const z0 = gz, z1 = gz + step;
      const p00 = [x0, terrainHeight(x0, z0), z0];
      const p10 = [x1, terrainHeight(x1, z0), z0];
      const p11 = [x1, terrainHeight(x1, z1), z1];
      const p01 = [x0, terrainHeight(x0, z1), z1];
      const checker = ((Math.floor(gx / step) + Math.floor(gz / step)) & 1) === 0;

      // Por defecto: Adoquin terracota y piedra ocre colonial del Malecon y Quibdo
      let col = checker ? [194, 118, 74] : [174, 102, 62];
      let tex = (Math.abs(gx) < 16 && gz > -8 && gz < 28) ? "adoquin" : null;

      // Zona 1: Muelle de madera del Malecon (-28..-14)
      if (gx >= -28 && gx < -14) {
        col = checker ? [164, 102, 54] : [144, 88, 44];
        if (Math.abs(gz) < 20) tex = "madera";
      }
      // Zona 2: Plaza de la Catedral (gz > 20) baldosa colonial crema y terracota
      else if (gz > 20 && Math.abs(gx) < 26) {
        col = checker ? [224, 186, 138] : [202, 162, 116];
        if (Math.abs(gx) < 14 && gz < 38) tex = "adoquin";
      }
      // Zona 3: Calles de Alameda Reyes y Carrera Primera (piedra gris-ocre calida con franja amarilla)
      else if (Math.abs(gx) < 7.5 || Math.abs(gz) < 6.5) {
        col = checker ? [124, 104, 96] : [108, 90, 82];
        if (Math.abs(gx) < 0.7 || Math.abs(gz) < 0.7) col = [242, 188, 42];
      }
      // Zona 4: Sendero del Tutunendo (gx > 22) tierra rojiza chocoana, arcilla y piedra dorada (CERO verde!)
      else if (gx > 22) {
        col = checker ? [184, 108, 64] : [162, 94, 54];
      }
      // Zona 5: Esteros Sur (gz < -22) puentes de madera de guayacan
      else if (gz < -22) {
        col = checker ? [154, 98, 52] : [132, 82, 42];
      }

      addQuadUV(staticTris, p00, p01, p11, p10, col, 0.04, tex, 0, 0, 1, 1);
    }
  }

  // Balaustrada Colonial y Faroles Torneados del Malecon (x = -27.2)
  for (let mz = -48; mz <= 48; mz += 6) {
    const my = terrainHeight(-27, mz);
    addBox(staticTris, -27.2, my + 0.55, mz, 0.65, 1.1, 4.8, [228, 202, 166], 0.08, "catedral");
    addCylinder(staticTris, -26.8, my + 1.1, mz, 0.22, 0.16, 2.2, 8, [64, 52, 44], 0, null);
    addSphereLowPoly(staticTris, -26.8, my + 3.4, mz, 0.38, 0.42, 0.38, 0, [255, 224, 118], 0.68, null);
  }

  // ZONA 2: Catedral de San Francisco de Asis de Quibdo Esculpida con Arcos, Cupula y Textura UV Pintada (Z = 38..44)
  const cyBase = terrainHeight(0, 38);
  // Escalinata Colonial de Piedra Ocre y Terracota (CERO escalon verde chillon)
  addBox(staticTris, 0, cyBase - 0.8, 30.0, 22.0, 0.45, 2.2, [196, 118, 68], 0.10, "adoquin");
  addBox(staticTris, 0, cyBase - 0.4, 32.2, 22.0, 0.45, 2.2, [242, 188, 54], 0.12, "adoquin");
  addBox(staticTris, 0, cyBase + 0.0, 34.4, 22.0, 0.45, 2.2, [218, 168, 118], 0.12, "adoquin");

  // Fachada Principal de la Catedral con Mapeo de Textura UV Real (tex_catedral_quibdo)
  addSubdividedQuadUV(
    staticTris,
    [-11, cyBase, 38.2],

  };

  function playSfx(freq, slideFreq, dur, waveType) {
    if (typeof window === "undefined") return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = new AC();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = waveType;
      osc.frequency.setValueAtTime(freq, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(slideFreq, ac.currentTime + dur);
      gain.gain.setValueAtTime(0.05, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  function calcNextXp(lv) {
    return Math.round(120 + lv * 95 + Math.pow(lv, 1.55) * 48);
  }

  function spawnEnemy(isBoss, customX, customZ) {
    const ang = (state.enemies.length * 1.37 + state.time * 0.65) % (Math.PI * 2);
    const dist = isBoss ? 14.5 : 8.5 + (state.enemies.length % 8) * 1.85;
    const ex = customX !== undefined ? customX : state.x + Math.cos(ang) * dist;
    const ez = customZ !== undefined ? customZ : state.z + Math.sin(ang) * dist;
    const clampedX = Math.max(-25, Math.min(48, ex));
    const clampedZ = Math.max(-48, Math.min(35, ez));
    const kindIdx = isBoss ? (state.kills % 2 === 0 ? 3 : 4) : state.enemies.length % 3;
    const meme = ENEMY_MEMES[kindIdx];
    const hpVal = isBoss ? 320 + state.level * 75 : 42 + state.level * 12;
    state.enemies.push({
      x: clampedX,
      y: terrainHeight(clampedX, clampedZ),
      z: clampedZ,
      vx: 0,
      vy: 0,
      vz: 0,
      rot: ang,
      spinVel: 0,
      hp: hpVal,
      maxHp: hpVal,
      isBoss: isBoss,
      kind: kindIdx,
      name: meme.name,
      scale: isBoss ? 1.55 : 0.82,
      rgb: meme.rgb,
      hitFlash: 0
    });
  }

  function damageEnemy(en, dmg, kx, ky, kz, label) {
    en.hp -= dmg;
    en.vx += kx * state.knockbackMult;
    en.vy = Math.max(en.vy, ky);
    en.vz += kz * state.knockbackMult;
    en.spinVel = 11.0;
    en.hitFlash = 0.18;
    state.floatTexts.push({
      x: en.x,
      y: en.y + 1.6,
      z: en.z,
      text: label || ("CANDELA -" + String(dmg)),
      life: 0.9,
      rgb: dmg >= 45 ? [255, 209, 102] : [255, 249, 236]
    });
  }

  function triggerChontadurazo() {
    state.waveShock = 1.0;
    state.mazoSwing = 1.0;
    playSfx(165, 58, 0.2, "sawtooth");
    state.enemies.forEach((en) => {
      const dx = en.x - state.x;
      const dz = en.z - state.z;
      const d = Math.hypot(dx, dz);
      if (d < 7.5) {
        const dmg = Math.round(48 * state.popochoLv * state.candelaMult);
        damageEnemy(
          en,
          dmg,
          (dx / Math.max(0.2, d)) * 11.0,
          6.8,
          (dz / Math.max(0.2, d)) * 11.0,
          "PATACONAZO -" + String(dmg) + "!"
        );
      }
    });
    // Also break nearby Crash Bandicoot crates!
    state.crates.forEach((cr) => {
      if (!cr.broken && Math.hypot(cr.x - state.x, cr.z - state.z) < 4.2) {
        cr.broken = true;
        cr.respawn = 14.0;
        state.gold += 25;
        state.hp = Math.min(state.maxHp, state.hp + 15);
        for (let g = 0; g < 3; g++) {
          state.gems.push({
            x: cr.x + (g - 1) * 0.65,
            y: terrainHeight(cr.x, cr.z) + 0.5,
            z: cr.z + (g % 2) * 0.5,
            val: 10,
            rot: g
          });
        }
        state.floatTexts.push({
          x: cr.x,
          y: terrainHeight(cr.x, cr.z) + 1.8,
          z: cr.z,
          text: cr.isViche ? "CAJA VICHE +$25!" : "CAJA CHONTADURO +3 FRUTAS!",
          life: 1.25,
          rgb: [255, 209, 102]
        });
      }
    });
  }

  function applyUpgradeChoice(slot) {
    if (state.pendingLevels <= 0) return;
    if (slot === 1) {
      state.chontaLv += 1;
      state.bannerText = "MEJORA: RAFAGA DE CHONTADURO NV." + state.chontaLv + " ACTIVADA!";
    } else if (slot === 2) {
      state.popochoLv += 1;
      state.knockbackMult = Number((state.knockbackMult + 0.25).toFixed(2));
      state.bannerText = "MEJORA: MAZO DE POPOCHO NV." + state.popochoLv + " ACTIVADO!";
    } else {
      state.borojoOrbs += 1;
      state.vicheLv += 1;
      state.candelaMult = Number((state.candelaMult + 0.25).toFixed(2));
      state.bannerText = "MEJORA: FUEGO DE VICHE Y BOROJO POWER ACTIVADO!";
    }
    state.hp = Math.min(state.maxHp, state.hp + 30);
    state.pendingLevels = Math.max(0, state.pendingLevels - 1);
    state.bannerTimer = 3.5;
    triggerChontadurazo();
  }

  function cycleHero() {
    state.heroIdx = (state.heroIdx + 1) % HEROES_CHOCO.length;
    const h = HEROES_CHOCO[state.heroIdx];
    state.bannerText = h.name + ': "' + h.quote + '"';
    state.bannerTimer = 4.0;
    playSfx(360, 720, 0.16, "triangle");
  }

  function tryUseShrine() {
    state.shrines.forEach((sh) => {
      if (!sh.used && Math.hypot(sh.x - state.x, sh.z - state.z) < 4.8) {
        sh.used = true;
        playSfx(440, 880, 0.25, "square");
        state.pendingLevels += 1;
        state.floatTexts.push({
          x: sh.x,
          y: terrainHeight(sh.x, sh.z) + 2.6,
          z: sh.z,
          text: "BENDICION: " + sh.kind + "!",
          life: 1.5,
          rgb: [255, 209, 102]
        });
      }
    });
  }

  // Initial population
  spawnEnemy(true, 0.8, 15.5);
  spawnEnemy(false, -3.5, 10.2);
  spawnEnemy(false, 3.6, 10.6);
  spawnEnemy(false, -2.4, 7.2);
  spawnEnemy(false, 2.8, 7.6);
  for (let i = 0; i < 12; i++) spawnEnemy(false);
  for (let g = 0; g < 6; g++) {
    const gx = -3.2 + g * 1.3;
    const gz = 5.2 + (g % 2) * 1.4;
    state.gems.push({ x: gx, y: terrainHeight(gx, gz) + 0.45, z: gz, val: 10, rot: g });
  }
  state.floatTexts.push({ x: -2.4, y: 2.3, z: 7.2, text: "CHONTADURAZO -64!", life: 1.4, rgb: [255, 209, 102] });
  state.floatTexts.push({ x: 2.8, y: 2.5, z: 7.6, text: "OBVIO BOBIS!", life: 1.4, rgb: [74, 222, 128] });

  const lightDir = vNorm([0.42, 0.84, -0.34]);

  function stepFrame(dt) {
    state.time += dt;
    if (state.levelCooldown > 0) state.levelCooldown = Math.max(0, state.levelCooldown - dt);
    if (state.bannerTimer > 0) state.bannerTimer = Math.max(0, state.bannerTimer - dt);

    // Check queued XP level up with 12-second minimum cooldown and NO movement freeze!
    if (state.xp >= state.xpNext && state.levelCooldown <= 0) {
      state.xp -= state.xpNext;
      state.level += 1;
      state.xpNext = calcNextXp(state.level);
      state.pendingLevels += 1;
      state.levelCooldown = 12.0;
      playSfx(520, 1040, 0.24, "triangle");
      state.floatTexts.push({
        x: state.x,
        y: state.y + 2.4,
        z: state.z,
        text: "NIVEL " + state.level + "! ELIGE [1] [2] [3]",
        life: 1.8,
        rgb: [255, 209, 102]
      });
    }

    // Player movement is NEVER frozen
    const isSlide = Boolean(keys["ShiftLeft"] || keys["ShiftRight"]);
    state.sliding = isSlide;
    const spd = isSlide ? 12.2 : 8.2;
    let mf = 0, ms = 0;
    if (keys["KeyW"] || keys["ArrowUp"]) mf += 1;
    if (keys["KeyS"] || keys["ArrowDown"]) mf -= 1;
    if (keys["KeyA"]) ms -= 1;
    if (keys["KeyD"]) ms += 1;
    if (keys["ArrowLeft"] || keys["KeyQ"]) state.camYaw -= 2.1 * dt;
    if (keys["ArrowRight"] || keys["KeyR"]) state.camYaw += 2.1 * dt;

    const sinY = Math.sin(state.camYaw);
    const cosY = Math.cos(state.camYaw);
    if (mf !== 0 || ms !== 0) {
      state.x = Math.max(-26.5, Math.min(50.0, state.x + (sinY * mf + cosY * ms) * spd * dt));
      state.z = Math.max(-50.0, Math.min(36.0, state.z + (cosY * mf - sinY * ms) * spd * dt));
      state.walkCycle += dt * (isSlide ? 14.0 : 9.5);
    }

    if (keys["Space"] && state.onGround) {
      state.vy = 8.2;
      state.onGround = false;
      playSfx(240, 440, 0.11, "square");
    }
    state.vy -= 18.5 * dt;
    state.y += state.vy * dt;
    const gy = terrainHeight(state.x, state.z);
    if (state.y <= gy) {
      state.y = gy;
      state.vy = 0;
      state.onGround = true;
    }

    if (state.waveShock > 0) state.waveShock = Math.max(0, state.waveShock - dt * 1.75);
    if (state.mazoSwing > 0) state.mazoSwing = Math.max(0, state.mazoSwing - dt * 3.2);

    // Respawn & break Crash Bandicoot crates on contact
    state.crates.forEach((cr) => {
      if (cr.broken) {
        cr.respawn -= dt;
        if (cr.respawn <= 0) cr.broken = false;
      } else if (Math.hypot(cr.x - state.x, cr.z - state.z) < 1.55) {
        cr.broken = true;
        cr.respawn = 14.0;
        state.gold += 20;
        for (let g = 0; g < 3; g++) {
          state.gems.push({
            x: cr.x + (g - 1) * 0.55,
            y: terrainHeight(cr.x, cr.z) + 0.5,
            z: cr.z,
            val: 10,
            rot: g
          });
        }
        playSfx(320, 640, 0.14, "square");
        state.floatTexts.push({
          x: cr.x,
          y: terrainHeight(cr.x, cr.z) + 1.6,
          z: cr.z,
          text: "CAJA ROTA +$20!",
          life: 1.1,
          rgb: [255, 209, 102]
        });
      }
    });

    // Weapon 1: Rafaga de Chontaduro
    state.fireCd -= dt;
    if (state.fireCd <= 0 && state.enemies.length > 0) {
      state.fireCd = Math.max(0.14, 0.42 - state.chontaLv * 0.045);
      let nearest = state.enemies[0];
      let bestD = 999;
      state.enemies.forEach((en) => {
        const d = Math.hypot(en.x - state.x, en.z - state.z);
        if (d < bestD) { bestD = d; nearest = en; }
      });
      if (nearest && bestD < 22) {
        const dx = nearest.x - state.x;
        const dz = nearest.z - state.z;
        const l = Math.max(0.1, Math.hypot(dx, dz));
        state.projectiles.push({
          x: state.x,
          y: state.y + 1.2,
          z: state.z,
          vx: (dx / l) * 19.5,
          vz: (dz / l) * 19.5,
          rot: 0,
          dmg: Math.round(25 * state.chontaLv * state.candelaMult),
          life: 1.35
        });
      }
    }

    // Weapon 4: Fuego de Viche Curado
    state.vicheCd -= dt;
    if (state.vicheCd <= 0 && state.enemies.length > 0) {
      state.vicheCd = Math.max(1.1, 2.4 - state.vicheLv * 0.22);
      const target = state.enemies[Math.floor(state.time * 7) % state.enemies.length];
      if (target) {
        state.vicheBombs.push({
          x: state.x,
          y: state.y + 1.5,
          z: state.z,
          vx: (target.x - state.x) * 1.1,
          vy: 6.2,
          vz: (target.z - state.z) * 1.1,
          rot: 0
        });
      }
    }

    // Weapon 2: Onda de Mazo de Popocho
    state.shockCd -= dt;
    if (state.shockCd <= 0) {
      state.shockCd = 3.2;
      triggerChontadurazo();
    }

    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const pr = state.projectiles[i];
      pr.x += pr.vx * dt;
      pr.z += pr.vz * dt;
      pr.rot += 12 * dt;
      pr.life -= dt;
      let hit = false;
      for (let j = 0; j < state.enemies.length; j++) {
        const en = state.enemies[j];
        if (Math.hypot(en.x - pr.x, en.z - pr.z) < en.scale + 0.55) {
          damageEnemy(en, pr.dmg, pr.vx * 0.28, 3.8, pr.vz * 0.28, "CHONTADURAZO -" + pr.dmg);
          hit = true;
          break;
        }
      }
      if (hit || pr.life <= 0) state.projectiles.splice(i, 1);
    }

    for (let i = state.vicheBombs.length - 1; i >= 0; i--) {
      const vb = state.vicheBombs[i];
      vb.x += vb.vx * dt;
      vb.y += vb.vy * dt;
      vb.z += vb.vz * dt;
      vb.vy -= 14.0 * dt;
      vb.rot += 9 * dt;
      const gy2 = terrainHeight(vb.x, vb.z);
      if (vb.y <= gy2 + 0.2) {
        state.explosions.push({ x: vb.x, y: gy2 + 0.4, z: vb.z, timer: 0.55 });
        state.enemies.forEach((en) => {
          const dx = en.x - vb.x, dz = en.z - vb.z;
          const d = Math.hypot(dx, dz);
          if (d < 4.8) {
            damageEnemy(
              en,
              Math.round(54 * state.candelaMult),
              (dx / Math.max(0.2, d)) * 9.5,
              6.2,
              (dz / Math.max(0.2, d)) * 9.5,
              "FUEGO VICHERO!"
            );
          }
        });
        state.vicheBombs.splice(i, 1);
      }
    }

    for (let i = state.explosions.length - 1; i >= 0; i--) {
      state.explosions[i].timer -= dt;
      if (state.explosions[i].timer <= 0) state.explosions.splice(i, 1);
    }

    // Weapon 3: Borojo Power Orbs
    for (let o = 0; o < state.borojoOrbs; o++) {
      const ang = state.time * 4.2 + (o * Math.PI * 2) / state.borojoOrbs;
      const ox = state.x + Math.cos(ang) * 2.75;
      const oz = state.z + Math.sin(ang) * 2.75;
      state.enemies.forEach((en) => {
        if (en.hitFlash <= 0 && Math.hypot(en.x - ox, en.z - oz) < en.scale + 0.6) {
          const dx = en.x - state.x, dz = en.z - state.z;
          const d = Math.max(0.2, Math.hypot(dx, dz));
          damageEnemy(en, Math.round(24 * state.candelaMult), (dx / d) * 7, 3.6, (dz / d) * 7, "BOROJO POWER!");
        }
      });
    }

    // Enemies AI & Physics
    for (let i = state.enemies.length - 1; i >= 0; i--) {
      const en = state.enemies[i];
      if (en.hitFlash > 0) en.hitFlash -= dt;
      const dx = state.x - en.x;
      const dz = state.z - en.z;
      const dist = Math.max(0.1, Math.hypot(dx, dz));
      en.rot = Math.atan2(dx, dz);
      const moveSpd = en.isBoss ? 2.2 : 3.1;
      en.x += ((dx / dist) * moveSpd + en.vx) * dt;
      en.z += ((dz / dist) * moveSpd + en.vz) * dt;
      en.vx *= Math.pow(0.07, dt);
      en.vz *= Math.pow(0.07, dt);
      en.vy -= 16.5 * dt;
      en.y += en.vy * dt;
      const egy = terrainHeight(en.x, en.z);
      if (en.y <= egy) {
        en.y = egy;
        en.vy = 0;
        en.spinVel = 0;
      } else {
        en.rot += en.spinVel * dt;
      }
      if (state.sliding && dist < 1.8 && en.hitFlash <= 0) {
        damageEnemy(en, 34, -(dx / dist) * 11, 5.8, -(dz / dist) * 11, "BARRIDA CHOCOANA!");
      }
      if (en.hp <= 0) {
        state.kills += 1;
        state.gold += en.isBoss ? 35 : 5;
        // Balanced XP gem value (9 XP normal, 32 XP boss -> takes ~13 kills for Lv 1)
        state.gems.push({ x: en.x, y: en.y + 0.45, z: en.z, val: en.isBoss ? 32 : 9, rot: 0 });
        state.enemies.splice(i, 1);
        spawnEnemy(state.kills % 14 === 0);
      }
    }
    while (state.enemies.length < 16) spawnEnemy(false);

    // Collect Chontaduro XP Gems
    for (let i = state.gems.length - 1; i >= 0; i--) {
      const gm = state.gems[i];
      gm.rot += 4.5 * dt;
      const dx = state.x - gm.x, dz = state.z - gm.z;
      const d = Math.hypot(dx, dz);
      if (d < 7.2) {
        gm.x += (dx / Math.max(0.1, d)) * 13.5 * dt;
        gm.z += (dz / Math.max(0.1, d)) * 13.5 * dt;
      }
      if (d < 1.35) {
        state.xp += gm.val;
        state.gems.splice(i, 1);
      }
    }

    for (let i = state.floatTexts.length - 1; i >= 0; i--) {
      state.floatTexts[i].y += 1.55 * dt;
      state.floatTexts[i].life -= dt;
      if (state.floatTexts[i].life <= 0) state.floatTexts.splice(i, 1);
    }

    // --- RENDER HIGH-RES 3D SCENE + NATIVE CRISP UI ---
    const vp = getViewportSize();
    const W = vp.w;
    const H = vp.h;
    if (canvas.width !== W || canvas.height !== H) {
      canvas.width = W;
      canvas.height = H;
    }
    const ctx = canvas.getContext("2d", { alpha: false });
    if (!ctx) return;

    const FOV = Math.min(W, H) * 0.86;
    const SNAP_GRID = 1; // Subtle PS1 precision at high resolution

    const camDist = 6.8;
    const camX = state.x - Math.sin(state.camYaw) * camDist;
    const camZ = state.z - Math.cos(state.camYaw) * camDist;
    const camY = state.y + 3.65;
    const cosP = Math.cos(state.camPitch);
    const sinP = Math.sin(state.camPitch);

    // 1. Golden Sunset Sky over the Rio Atrato (Crash Bandicoot Sunset Vista palette)
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.58);
    skyGrad.addColorStop(0.0, "#1D1138");
    skyGrad.addColorStop(0.32, "#6B1D57");
    skyGrad.addColorStop(0.68, "#D95326");
    skyGrad.addColorStop(1.0, "#F7B32B");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Distant Sunset Sun & Jungle Mountains Silhouette on Horizon
    const horizonY = Math.floor(H * 0.5 - Math.tan(state.camPitch) * FOV * 0.45);
    const sunGrad = ctx.createRadialGradient(W * 0.25, horizonY - 25, 10, W * 0.25, horizonY - 25, 130);
    sunGrad.addColorStop(0, "rgba(255, 243, 176, 0.95)");
    sunGrad.addColorStop(0.45, "rgba(251, 146, 60, 0.45)");
    sunGrad.addColorStop(1, "rgba(251, 146, 60, 0)");
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, W, H * 0.65);

    const frameTris = [];

    // Animated Rio Atrato Waves with Golden Sunset Specular Reflections
    const wStep = 4.5;
    for (let wx = -44; wx < -27; wx += wStep) {
      for (let wz = Math.max(-48, Math.floor((state.z - 32) / wStep) * wStep); wz < Math.min(48, state.z + 32); wz += wStep) {
        const x0 = wx, x1 = wx + wStep;
        const z0 = wz, z1 = wz + wStep;
        const h00 = -1.1 + Math.sin(x0 * 0.5 + state.time * 3.0) * 0.22;
        const h10 = -1.1 + Math.sin(x1 * 0.5 + state.time * 3.0) * 0.22;
        const h11 = -1.1 + Math.cos(z1 * 0.5 + state.time * 2.5) * 0.22;
        const h01 = -1.1 + Math.cos(z0 * 0.5 + state.time * 2.5) * 0.22;
        const shimmer = ((Math.floor(wx + wz + state.time * 3) & 1) === 0);
        const col1 = shimmer ? [238, 128, 68] : [36, 134, 178];
        const col2 = [28, 108, 156];
        frameTris.push(makeTri([x0, h00, z0], [x0, h01, z1], [x1, h11, z1], col1, 0.22));
        frameTris.push(makeTri([x0, h00, z0], [x1, h11, z1], [x1, h10, z0], col2, 0.16));
      }
    }

    // Crash Bandicoot Crates [?] & [VICHE]
    state.crates.forEach((cr) => {
      if (!cr.broken) {
        addCrashCrate3D(frameTris, cr.x, terrainHeight(cr.x, cr.z), cr.z, state.time * 0.6, cr.isViche);
      }
    });

    // Shrines / Altares
    state.shrines.forEach((sh) => {
      const sy = terrainHeight(sh.x, sh.z);
      addCylinder(frameTris, sh.x, sy, sh.z, 0.9, 0.7, 0.95, 6, [138, 112, 86], 0.05);
      if (!sh.used) {
        addSphereLowPoly(frameTris, sh.x, sy + 1.85 + Math.sin(state.time * 3.5) * 0.22, sh.z, 0.62, 0.85, 0.62, state.time * 2.2, sh.rgb, 0.45);
      }
    });

    // Chocoan Ally NPCs around Quibdo (Dona Cruz, Jonyer, Mototaxista, Don Sabroso)
    state.allies.forEach((al, idx) => {
      const ay = terrainHeight(al.x, al.z);
      addArticulatedHuman3D(
        frameTris,
        al.x, ay, al.z,
        Math.sin(state.time * 1.2 + idx) * 0.6 + Math.PI,
        state.time * 3.0 + idx,
        0.92,
        [126, 76, 42],
        al.shirt,
        [30, 41, 59],
        al.hat,
        false,
        -1
      );
    });

    // Sculpted 3D Chontaduro Gems, Projectiles, Viche Bottles & Explosions with UV Textures
    state.gems.forEach((gm) => {
      addSculptedChontaduro3D(frameTris, gm.x, gm.y + Math.sin(state.time * 5 + gm.rot) * 0.12, gm.z, 0.72, gm.rot, true);
    });
    state.projectiles.forEach((pr) => {
      addSculptedChontaduro3D(frameTris, pr.x, pr.y, pr.z, 0.68, pr.rot, false);
    });
    state.vicheBombs.forEach((vb) => {
      addSculptedVicheBottle3D(frameTris, vb.x, vb.y - 0.30, vb.z, 0.65, vb.rot, false);
    });
    state.explosions.forEach((ex) => {
      const sc = (0.6 - ex.timer) * 6.8;
      addSphereLowPoly(frameTris, ex.x, ex.y + 0.5, ex.z, sc, sc * 0.8, sc, state.time * 8, [252, 138, 24], 0.78, "chontaduro");
    });

    // Onda de Popocho Shockwave Ring
    if (state.waveShock > 0) {
      const rad = (1.0 - state.waveShock) * 7.2 + 0.9;
      const segs = 14;
      for (let i = 0; i < segs; i++) {
        const a0 = (i / segs) * Math.PI * 2;
        const a1 = ((i + 1) / segs) * Math.PI * 2;
        const rIn = rad * 0.80;
        const yWave = state.y + 0.25;
        addQuad(
          frameTris,
          [state.x + Math.cos(a0) * rIn, yWave, state.z + Math.sin(a0) * rIn],
          [state.x + Math.cos(a0) * rad, yWave + 0.36, state.z + Math.sin(a0) * rad],
          [state.x + Math.cos(a1) * rad, yWave + 0.36, state.z + Math.sin(a1) * rad],
          [state.x + Math.cos(a1) * rIn, yWave, state.z + Math.sin(a1) * rIn],
          [255, 209, 102],
          0.65
        );
      }
    }

    // Orbiting Sculpted Borojo & Chontaduro Power Meshes with UV Textures
    for (let o = 0; o < state.borojoOrbs; o++) {
      const ang = state.time * 4.2 + (o * Math.PI * 2) / state.borojoOrbs;
      const ox = state.x + Math.cos(ang) * 2.75;
      const oz = state.z + Math.sin(ang) * 2.75;
      addSphereLowPoly(frameTris, ox, state.y + 1.05, oz, 0.40, 0.44, 0.40, ang * 2, [164, 98, 52], 0.38, "borojo");
    }

    // Hero Player 15-Part Articulated 3D Character
    const hero = HEROES_CHOCO[state.heroIdx];
    addArticulatedHuman3D(
      frameTris,
      state.x, state.y, state.z,
      state.camYaw,
      state.walkCycle,
      1.0,
      [126, 76, 42],
      hero.shirt,
      hero.pants,
      hero.hat,
      state.sliding,
      state.mazoSwing
    );

    // Articulated Multi-Part Enemies & Meme Bosses
    state.enemies.forEach((en) => {
      const sc = en.scale;
      const rgb = en.hitFlash > 0 ? [255, 255, 255] : en.rgb;
      addArticulatedHuman3D(
        frameTris,
        en.x, en.y, en.z,
        en.rot,
        state.time * 8.5 + en.x,
        sc,
        en.isBoss ? [88, 44, 128] : [96, 62, 42],
        rgb,
        [28, 34, 48],
        en.isBoss ? [250, 204, 21] : [224, 58, 42],
        false,
        0.3
      );
    });

    function worldToCam(v) {
      const dx = v[0] - camX;
      const dy = v[1] - camY;
      const dz = v[2] - camZ;
      const rx = dx * cosY - dz * sinY;
      const rz = dx * sinY + dz * cosY;
      const cy = dy * cosP + rz * sinP;
      const cz = rz * cosP - dy * sinP;
      return [rx, cy, cz];
    }

    const renderQueue = [];
    const totalStatic = staticWorldTris.length;
    const totalDyn = frameTris.length;
    const allCount = totalStatic + totalDyn;

    for (let i = 0; i < allCount; i++) {
      const t = i < totalStatic ? staticWorldTris[i] : frameTris[i - totalStatic];
      const c0 = worldToCam(t.v0);
      const c1 = worldToCam(t.v1);
      const c2 = worldToCam(t.v2);
      if (c0[2] < 0.35 && c1[2] < 0.35 && c2[2] < 0.35) continue;
      const z0 = Math.max(0.35, c0[2]);
      const z1 = Math.max(0.35, c1[2]);
      const z2 = Math.max(0.35, c2[2]);
      const zAvg = (z0 + z1 + z2) * 0.3333;
      if (zAvg > 64) continue;

      const sx0 = Math.round((W * 0.5 + (c0[0] / z0) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sy0 = Math.round((H * 0.5 - (c0[1] / z0) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sx1 = Math.round((W * 0.5 + (c1[0] / z1) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sy1 = Math.round((H * 0.5 - (c1[1] / z1) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sx2 = Math.round((W * 0.5 + (c2[0] / z2) * FOV) / SNAP_GRID) * SNAP_GRID;
      const sy2 = Math.round((H * 0.5 - (c2[1] / z2) * FOV) / SNAP_GRID) * SNAP_GRID;

      if ((sx0 < -120 && sx1 < -120 && sx2 < -120) || (sx0 > W + 120 && sx1 > W + 120 && sx2 > W + 120)) continue;
      if ((sy0 < -120 && sy1 < -120 && sy2 < -120) || (sy0 > H + 120 && sy1 > H + 120 && sy2 > H + 120)) continue;

      const dot = Math.max(0, t.n[0] * lightDir[0] + t.n[1] * lightDir[1] + t.n[2] * lightDir[2]);
      const intensity = Math.min(1.38, 0.44 + dot * 0.68 + t.emit);
      // Warm Golden Sunset atmospheric perspective (NO green fog!)
      const fog = Math.max(0, Math.min(0.60, (zAvg - 32) / 36));
      const r = Math.min(255, Math.floor(t.rgb[0] * intensity * (1 - fog) + 232 * fog));
      const g = Math.min(255, Math.floor(t.rgb[1] * intensity * (1 - fog) + 122 * fog));
      const b = Math.min(255, Math.floor(t.rgb[2] * intensity * (1 - fog) + 74 * fog));

      const shadeAlpha = Math.max(0, Math.min(0.55, 1.05 - intensity));
      renderQueue.push({
        sx0: sx0, sy0: sy0, sx1: sx1, sy1: sy1, sx2: sx2, sy2: sy2,
        zAvg: zAvg,
        tex: (t.tex && zAvg < 64) ? t.tex : 'adoquin',
        uv0: t.uv0, uv1: t.uv1, uv2: t.uv2,
        shadeRgba: shadeAlpha > 0.04 ? ("rgba(28, 14, 10, " + shadeAlpha.toFixed(2) + ")") : null,
        fill: "rgb(" + r + "," + g + "," + b + ")",
        stroke: "rgb(" + Math.max(0, r - 14) + "," + Math.max(0, g - 14) + "," + Math.max(0, b - 14) + ")"
      });
    }

    renderQueue.sort((a, b) => b.zAvg - a.zAvg);
    for (let i = 0; i < renderQueue.length; i++) {
      const rq = renderQueue[i];
      const texImg = rq.tex ? texImages[rq.tex] : null;
      if (texImg && texImg.complete && texImg.naturalWidth > 0 && rq.uv0 && rq.uv1 && rq.uv2) {
        drawTexturedTriangleAffine(
          ctx, texImg,
          rq.sx0, rq.sy0, rq.sx1, rq.sy1, rq.sx2, rq.sy2,
          rq.uv0[0], rq.uv0[1], rq.uv1[0], rq.uv1[1], rq.uv2[0], rq.uv2[1],
          rq.shadeRgba
        );
      } else {
        ctx.beginPath();
        ctx.moveTo(rq.sx0, rq.sy0);
        ctx.lineTo(rq.sx1, rq.sy1);
        ctx.lineTo(rq.sx2, rq.sy2);
        ctx.closePath();
        ctx.fillStyle = rq.fill;
        ctx.fill();
        ctx.strokeStyle = rq.stroke;
        // Smooth sculpted edges without wireframe stroke
      }
    }

    // Floating 3D Labels over Allies & Bosses
    state.allies.forEach((al) => {
      const cv = worldToCam([al.x, terrainHeight(al.x, al.z) + 2.45, al.z]);
      if (cv[2] > 1.0 && cv[2] < 28) {
        const sx = W * 0.5 + (cv[0] / cv[2]) * FOV;
        const sy = H * 0.5 - (cv[1] / cv[2]) * FOV;
        ctx.font = "800 13px 'Chakra Petch', system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.strokeStyle = "#0F141C";
        ctx.lineWidth = 3.5;
        ctx.strokeText(al.name, sx, sy);
        ctx.fillStyle = "#FFD166";
        ctx.fillText(al.name, sx, sy);
        if (cv[2] < 16) {
          ctx.font = "700 11px 'JetBrains Mono', monospace";
          ctx.strokeText('"' + al.quote + '"', sx, sy + 15);
          ctx.fillStyle = "#FFF9EC";
          ctx.fillText('"' + al.quote + '"', sx, sy + 15);
        }
        ctx.textAlign = "left";
      }
    });

    state.enemies.forEach((en) => {
      if (en.isBoss || Math.hypot(en.x - state.x, en.z - state.z) < 12) {
        const cv = worldToCam([en.x, en.y + 2.2 * en.scale, en.z]);
        if (cv[2] > 1.0 && cv[2] < 30) {
          const sx = W * 0.5 + (cv[0] / cv[2]) * FOV;
          const sy = H * 0.5 - (cv[1] / cv[2]) * FOV;
          ctx.font = (en.isBoss ? "900 14px" : "800 11px") + " 'Chakra Petch', system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.strokeStyle = "#0F141C";
          ctx.lineWidth = 3;
          ctx.strokeText(en.name, sx, sy);
          ctx.fillStyle = en.isBoss ? "#FB7185" : "#FDE047";
          ctx.fillText(en.name, sx, sy);
          // Enemy HP mini bar
          const bw = en.isBoss ? 76 : 44;
          ctx.fillStyle = "#0F141C";
          ctx.fillRect(sx - bw * 0.5, sy + 4, bw, 5);
          ctx.fillStyle = en.isBoss ? "#F43F5E" : "#EF4444";
          ctx.fillRect(sx - bw * 0.5 + 1, sy + 5, Math.max(0, (bw - 2) * (en.hp / en.maxHp)), 3);
          ctx.textAlign = "left";
        }
      }
    });

    // Floating Combat Damage Numbers (Crisp Modern Font)
    state.floatTexts.forEach((ft) => {
      const cv = worldToCam([ft.x, ft.y, ft.z]);
      if (cv[2] > 0.6) {
        const sx = W * 0.5 + (cv[0] / cv[2]) * FOV;
        const sy = H * 0.5 - (cv[1] / cv[2]) * FOV;
        ctx.font = "900 15px 'Chakra Petch', 'Montserrat', system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.strokeStyle = "#0F141C";
        ctx.lineWidth = 4;
        ctx.strokeText(ft.text, sx, sy);
        ctx.fillStyle = "rgb(" + ft.rgb[0] + "," + ft.rgb[1] + "," + ft.rgb[2] + ")";
        ctx.fillText(ft.text, sx, sy);
        ctx.textAlign = "left";
      }
    });

    // =========================================================================
    // 2D HIGH-RESOLUTION MODERN INDIE UI LAYER (Hades / Balatro / Schedule I style)
    // =========================================================================
    function drawCard(x, y, w, h, borderCol) {
      ctx.save();
      ctx.fillStyle = "rgba(15, 20, 28, 0.90)";
      ctx.strokeStyle = borderCol || "#D97706";
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8);
      else ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawBar(x, y, w, h, ratio, fillCol) {
      ctx.fillStyle = "#090D14";
      ctx.fillRect(x, y, w, h);
      const fw = Math.max(0, Math.min(w - 2, Math.floor((w - 2) * ratio)));
      ctx.fillStyle = fillCol;
      ctx.fillRect(x + 1, y + 1, fw, h - 2);
      ctx.strokeStyle = "rgba(255, 249, 236, 0.22)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, w, h);
    }

    const zone = getZoneInfo(state.x, state.z);
    const mins = String(Math.floor(state.time / 60)).padStart(2, "0");
    const secs = String(Math.floor(state.time % 60)).padStart(2, "0");

    // 1. TOP BAR: XP Progress & Zone Banner
    drawCard(14, 10, W - 28, 34, "#F59E0B");
    drawBar(22, 17, Math.floor(W * 0.42), 20, Math.min(1, state.xp / Math.max(1, state.xpNext)), "#10B981");
    ctx.font = "700 13px 'JetBrains Mono', 'Consolas', monospace";
    ctx.fillStyle = "#FFF9EC";
    ctx.fillText(
      "NIVEL " + state.level + "  XP " + state.xp + "/" + state.xpNext + "  |  TIEMPO " + mins + ":" + secs + "  |  DERROTADOS: " + state.kills,
      30,
      31
    );
    ctx.font = "800 14px 'Chakra Petch', 'Space Grotesk', system-ui, sans-serif";
    ctx.fillStyle = zone.col;
    ctx.textAlign = "right";
    ctx.fillText("ZONA: " + zone.name, W - 24, 31);
    ctx.textAlign = "left";

    // 2. TOP-LEFT HERO STATUS CARD WITH REAL PHOTO PORTRAIT
    drawCard(14, 52, 368, 114, "#FFD166");
    const heroImg = texImages["chontaduro"];
    if (heroImg && heroImg.complete && heroImg.naturalWidth > 0) {
      ctx.drawImage(heroImg, 24, 62, 54, 54);
      ctx.strokeStyle = "#FFD166";
      ctx.lineWidth = 2;
      ctx.strokeRect(24, 62, 54, 54);
    }
    ctx.font = "900 16px 'Chakra Petch', 'Montserrat', system-ui, sans-serif";
    ctx.fillStyle = "#FFD166";
    ctx.fillText("LA PAILA DEL ATRATO: CANDELA EN QUIBDO 3D", 88, 76);
    ctx.font = "800 13px 'Chakra Petch', system-ui, sans-serif";
    ctx.fillStyle = "#FFF9EC";
    ctx.fillText("HEROE [C]: " + hero.name, 88, 95);

    drawBar(88, 103, 195, 16, state.hp / state.maxHp, "#EF4444");
    ctx.font = "700 12px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#FFF9EC";
    ctx.fillText("VIDA " + state.hp + "/" + state.maxHp, 290, 115);

    ctx.font = "700 13px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#6EE7B7";
    ctx.fillText("PATACONES: $" + state.gold + " COP   |   CANDELA: x" + state.candelaMult, 24, 138);
    ctx.font = "600 12px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#CBD5E1";
    ctx.fillText("[CLIC/F] PATACONAZO   [ESPACIO] SALTO   [C] HEROE", 24, 156);

    // 3. TOP-RIGHT LARGE 5-ZONE QUIBDO MINIMAP
    const mapS = 142;
    const mapX = W - mapS - 14;
    const mapY = 52;
    drawCard(mapX, mapY, mapS, mapS + 22, "#38BDF8");
    ctx.font = "800 12px 'Chakra Petch', system-ui, sans-serif";
    ctx.fillStyle = "#7DD3FC";
    ctx.textAlign = "center";
    ctx.fillText("MAPA DE QUIBDO (5 ZONAS)", mapX + mapS * 0.5, mapY + 16);
    ctx.textAlign = "left";

    const mLeft = mapX + 8, mTop = mapY + 22, mDim = mapS - 16;
    ctx.fillStyle = "#16202A";
    ctx.fillRect(mLeft, mTop, mDim, mDim);
    // Rio Atrato Strip on West of Minimap
    ctx.fillStyle = "#0284C7";
    ctx.fillRect(mLeft, mTop, mDim * 0.22, mDim);
    // Plaza Catedral North
    ctx.fillStyle = "rgba(250, 204, 21, 0.25)";
    ctx.fillRect(mLeft + mDim * 0.22, mTop, mDim * 0.55, mDim * 0.25);
    // Sendero Tutunendo East
    ctx.fillStyle = "rgba(74, 222, 128, 0.22)";
    ctx.fillRect(mLeft + mDim * 0.72, mTop, mDim * 0.28, mDim);

    const worldToMapX = (wx) => mLeft + Math.max(4, Math.min(mDim - 4, ((wx + 45) / 95) * mDim));
    const worldToMapY = (wz) => mTop + Math.max(4, Math.min(mDim - 4, ((45 - wz) / 95) * mDim));

    // Cathedral icon
    ctx.fillStyle = "#FFD166";
    ctx.fillRect(worldToMapX(0) - 5, worldToMapY(40) - 4, 10, 7);
    // Shrines
    state.shrines.forEach((sh) => {
      if (!sh.used) {
        ctx.fillStyle = "#34D399";
        ctx.fillRect(worldToMapX(sh.x) - 3, worldToMapY(sh.z) - 3, 6, 6);
      }
    });
    // Enemies
    state.enemies.forEach((en) => {
      ctx.fillStyle = en.isBoss ? "#F43F5E" : "#FB923C";
      const s = en.isBoss ? 5 : 3;
      ctx.fillRect(worldToMapX(en.x) - s * 0.5, worldToMapY(en.z) - s * 0.5, s, s);
    });
    // Player dot & direction
    const pxM = worldToMapX(state.x), pyM = worldToMapY(state.z);
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(pxM, pyM, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = "700 10px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#E2E8F0";
    ctx.fillText("ATRATO | CATEDRAL | TUTUNENDO", mapX + 8, mapY + mapS + 15);

    // 4. NON-BLOCKING LEVEL-UP / BENDICION CHOCOANA BAR (NEVER FREEZES MOVEMENT!)
    if (state.pendingLevels > 0) {
      const upW = Math.min(680, W - 40);
      const upX = Math.floor((W - upW) * 0.5);
      const upY = H - 152;
      drawCard(upX, upY, upW, 74, "#FFD166");
      ctx.font = "900 14px 'Chakra Petch', system-ui, sans-serif";
      ctx.fillStyle = "#FFD166";
      ctx.fillText(
        "BENDICION DE SAN PACHO LISTA (" + state.pendingLevels + ") - PULSA [1] [2] O [3] SIN DEJAR DE CORRER:",
        upX + 14,
        upY + 20
      );
      const opts = [
        { k: "[1] RAFAGA CHONTADURO", d: "+Cadencia y Dano", col: "#FB923C" },
        { k: "[2] MAZO DE POPOCHO", d: "+Onda y Empuje", col: "#FACC15" },
        { k: "[3] VICHE Y BOROJO", d: "+Orbe y +30 Vida", col: "#34D399" }
      ];
      opts.forEach((op, idx) => {
        const bx = upX + 14 + idx * Math.floor((upW - 28) / 3);
        const bw = Math.floor((upW - 44) / 3);
        drawCard(bx, upY + 27, bw, 38, op.col);
        ctx.font = "800 12px 'Chakra Petch', system-ui, sans-serif";
        ctx.fillStyle = op.col;
        ctx.fillText(op.k, bx + 10, upY + 44);
        ctx.font = "700 11px 'JetBrains Mono', monospace";
        ctx.fillStyle = "#FFF9EC";
        ctx.fillText(op.d, bx + 10, upY + 59);
      });
    } else if (state.bannerTimer > 0) {
      const bw = Math.min(580, W - 40);
      const bx = Math.floor((W - bw) * 0.5);
      drawCard(bx, H - 114, bw, 32, "#FFD166");
      ctx.font = "800 13px 'Chakra Petch', system-ui, sans-serif";
      ctx.fillStyle = "#FFF9EC";
      ctx.textAlign = "center";
      ctx.fillText(state.bannerText, W * 0.5, H - 93);
      ctx.textAlign = "left";
    }

    // 5. BOTTOM WEAPON ARSENAL BAR WITH REAL TEXTURE THUMBNAILS
    const barW = Math.min(820, W - 24);
    const barH = 66;
    const barX = Math.floor((W - barW) * 0.5);
    const barY = H - 74;
    drawCard(barX, barY, barW, barH, "#D97706");

    const weapons = [
      { key: "chontaduro", title: "[1] CHONTADURO NV." + state.chontaLv, sub: "Rafaga Caliente" },
      { key: "popocho", title: "[2] POPOCHO NV." + state.popochoLv, sub: "Mazo Pataconazo" },
      { key: "borojo", title: "[3] BOROJO x" + state.borojoOrbs, sub: "Escudo Potencia" },
      { key: "viche", title: "[4] VICHE NV." + state.vicheLv, sub: "Candela Curada" }
    ];
    const slotW = Math.floor((barW - 24) / 4);
    weapons.forEach((wp, i) => {
      const sx = barX + 12 + i * slotW;
      const sy = barY + 8;
      const img = texImages[wp.key];
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, sx, sy, 34, 34);
        ctx.strokeStyle = "#FFD166";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(sx, sy, 34, 34);
      }
      ctx.font = "800 13px 'Chakra Petch', system-ui, sans-serif";
      ctx.fillStyle = "#FFD166";
      ctx.fillText(wp.title, sx + 42, sy + 15);
      ctx.font = "700 11px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#E2E8F0";
      ctx.fillText(wp.sub, sx + 42, sy + 30);
    });

    ctx.font = "700 11px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#94A3B8";
    ctx.textAlign = "center";
    ctx.fillText(
      "WASD: RECORRER QUIBDO  |  ESPACIO: SALTO  |  SHIFT: BARRIDA  |  CLIC/F: PATACONAZO  |  E: ALTAR  |  1-2-3: MEJORAS",
      W * 0.5,
      barY + 58
    );
    ctx.textAlign = "left";
  }

  return {
    state: state,
    keys: keys,
    drag: drag,
    stepFrame: stepFrame,
    triggerChontadurazo: triggerChontadurazo,
    applyUpgradeChoice: applyUpgradeChoice,
    cycleHero: cycleHero,
    tryUseShrine: tryUseShrine
  };
}

    const cvs = document.getElementById("gameCanvas");
    const game = createGame1Runtime(cvs, function() {
      return { w: window.innerWidth || 1280, h: window.innerHeight || 720 };
    });

    window.addEventListener("keydown", function(e) {
      game.keys[e.code] = true;
      if (e.code === "Digit1" || e.code === "Numpad1") game.applyUpgradeChoice(1);
      if (e.code === "Digit2" || e.code === "Numpad2") game.applyUpgradeChoice(2);
      if (e.code === "Digit3" || e.code === "Numpad3") game.applyUpgradeChoice(3);
      if (e.code === "KeyE") game.tryUseShrine();
      if (e.code === "KeyF") game.triggerChontadurazo();
      if (e.code === "KeyC") game.cycleHero();
      if (e.code === "Space") e.preventDefault();
    });

    window.addEventListener("keyup", function(e) {
      game.keys[e.code] = false;
    });

    cvs.addEventListener("mousedown", function(e) {
      game.drag.active = true;
      game.drag.lastX = e.clientX;
      game.drag.lastY = e.clientY;
      if (e.button === 0) game.triggerChontadurazo();
    });

    window.addEventListener("mousemove", function(e) {
      if (!game.drag.active) return;
      const dx = e.clientX - game.drag.lastX;
      const dy = e.clientY - game.drag.lastY;
      game.drag.lastX = e.clientX;
      game.drag.lastY = e.clientY;
      game.state.camYaw += dx * 0.006;
      game.state.camPitch = Math.max(-0.62, Math.min(0.15, game.state.camPitch - dy * 0.004));
    });

    window.addEventListener("mouseup", function() {
      game.drag.active = false;
    });

    let lastTs = performance.now();
    function loop(ts) {
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      game.stepFrame(dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
